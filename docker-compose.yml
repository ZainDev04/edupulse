services:
  api:
    build: .
    image: edupulse:latest
    container_name: edupulse-api
    ports:
      - "8000:8000"
    environment:
      - EDUPULSE_LOG_LEVEL=INFO
    restart: unless-stopped

  dashboard:
    image: edupulse:latest
    container_name: edupulse-dashboard
    depends_on:
      - api
    command: ["streamlit", "run", "app/dashboard.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    ports:
      - "8501:8501"
    restart: unless-stopped

  mlflow:
    image: edupulse:latest
    container_name: edupulse-mlflow
    command: ["python", "-m", "mlflow", "ui", "--backend-store-uri", "sqlite:////app/mlruns/mlflow.db", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "5000:5000"
    restart: unless-stopped

  web:
    build: ./web
    image: edupulse-web:latest
    container_name: edupulse-web
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000
    ports:
      - "3000:3000"
    restart: unless-stopped
