[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edupulse"
version = "1.2.0"
description = "EduPulse - production-grade student performance intelligence platform (early-warning, score prediction, explainability, fairness)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shaikh Muhammad Zain" }]
keywords = ["machine-learning", "education", "fastapi", "streamlit", "shap", "optuna", "mlflow", "mlops"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Education",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.4",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "joblib>=1.3",
  "optuna>=3.4",
  "shap>=0.44",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "typer>=0.12",
  "tabulate>=0.9",
]

[project.optional-dependencies]
boosting = ["xgboost>=2.0", "lightgbm>=4.1"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27"]
dashboard = ["streamlit>=1.32", "plotly>=5.18"]
tracking = ["mlflow>=2.12"]
dev = ["pytest>=8", "pytest-cov>=4.1", "ruff>=0.4", "pre-commit>=3.6", "nbformat>=5.9", "jupyter>=1.0", "nbconvert>=7.10", "ipykernel>=6.29"]
all = ["edupulse[boosting,api,dashboard,tracking,dev]"]

[project.scripts]
edupulse = "edupulse.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "api", "app"]
extend-exclude = ["notebooks", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["N803", "N806", "B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long-running end-to-end tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.coverage.run]
source = ["src/edupulse"]
branch = true
