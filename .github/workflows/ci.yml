name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check . && ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: pytest --cov=edupulse --cov-report=xml --cov-report=term
      - uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with: { files: coverage.xml }
        continue-on-error: true

  train-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && pip install -e .
      - name: Train all tasks (fast)
        run: edupulse train --all --no-tune --repeats 1 --folds 3
      - name: Smoke-test API
        run: |
          uvicorn api.main:app --port 8000 &
          sleep 8
          curl -fs http://localhost:8000/health
          curl -fs -X POST http://localhost:8000/predict/at-risk -H 'Content-Type: application/json' \
            -d '{"gender":"female","race_ethnicity":"group B","parental_level_of_education":"high school","lunch":"free/reduced","test_preparation_course":"none"}'
      - uses: actions/upload-artifact@v5
        with:
          name: model-cards
          path: models/**/model_card.md

  web:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx eslint src && npx tsc --noEmit -p .
      - run: npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: TRIALS=5
          tags: edupulse:ci
